<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Shiv Computer - Login</title>
    <meta name="description" content="Complete role-based frontend system for Shiv Computer featuring distinct Admin and User dashboards, application management, services, multilingual support, and dark/light modes." />
    <meta property="og:title" content="Shiv Computer - Login" />
    <meta property="og:description" content="Complete role-based frontend system for Shiv Computer featuring distinct Admin and User dashboards, application management, services, multilingual support, and dark/light modes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      try {
        const savedTheme = localStorage.getItem('sc_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark', 'dark-mode');
        }
      } catch (e) {}

      // Disable two-finger pinch-to-zoom on mobile devices while preserving normal scrolling & responsiveness
      try {
        // Prevent multi-touch pinch-to-zoom (when 2 or more fingers touch the screen)
        document.addEventListener('touchmove', function(e) {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        }, { passive: false });

        // Prevent iOS Safari gesture-based pinch zoom
        document.addEventListener('gesturestart', function(e) {
          e.preventDefault();
        }, { passive: false });

        document.addEventListener('gesturechange', function(e) {
          e.preventDefault();
        }, { passive: false });

        document.addEventListener('gestureend', function(e) {
          e.preventDefault();
        }, { passive: false });
      } catch (e) {}
    </script>
  </head>
  <body class="font-sans antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
